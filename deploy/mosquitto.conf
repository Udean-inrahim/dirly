persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Listen on all interfaces so ESP32 devices can reach the broker over LAN/internet.
listener 1883 0.0.0.0
allow_anonymous true

# Auth (recommended for production over the internet).
# Uncomment after generating a password file:
#   docker compose exec mqtt mosquitto_passwd -c /mosquitto/config/mosquitto.passwd <username>
# then set:
#   password_file /mosquitto/config/mosquitto.passwd
#   allow_anonymous false
# and uncomment MQTT_USERNAME/MQTT_PASSWORD in .env